if (JavaVersion.current().isJava9Compatible()) {
	compileJava {
		options.release = versions.javaLwjgl3
	}
}
sourceCompatibility = versions.javaLwjgl3
targetCompatibility = versions.javaLwjgl3

sourceSets.test.java.srcDirs = ["test"]

dependencies {
	api libraries.lwjgl3sdl
	api libraries.lwjgl3sdlGLES
	api gdxnatives.desktop
	testImplementation libraries.junit
}

test {
	// Exclude nested helper classes; a non-public inner class trips JUnit4's "Invalid test class ... is not public".
	exclude '**/*$*.class'
	testLogging {
		showStandardStreams = true
		exceptionFormat = "full"
	}
}


